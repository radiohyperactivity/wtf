    <rect x="86" y="326" width="340" height="100" rx="22" fill="#ffffff"/>
    <rect x="132" y="206" width="248" height="100" rx="22" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="176" y="86" width="160" height="100" rx="22" fill="#ffffff" fill-opacity="0.7"/>
  </g>
</svg>
