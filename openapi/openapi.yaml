openapi: 3.1.0
info:
  title: WtF API
  version: "1"
  description: |
    Version 1 of the API, served under /api/v1. Within a version the API only
    grows (new routes, optional fields, fields in answers); every answer names
    the current revision in the `API-Revision` header. A breaking change would
    become /api/v2, served next to /api/v1 for a while. A request for a
    version the server doesn't serve gets an `unsupported-api-version`
    problem that lists the versions it does serve (`supported`).

    Where to Find: a register of the things you own and where they are.
    Every endpoint calls one database function; see API.md for the semantics
    and WTFD.md for the HTTP conventions.

    - Numbers of attributes and items with a unit are given and stored in the
      base unit of the unit's quantity; responses add a `display` value in the
      best-scaling unit of the unit's family, or in the unit itself when
      `unit_lock` is set.
    - The hostname picks the inventory: its first label is a tenant's host
      ("bob" for bob.wtf.example), see TENANTS.md. A hostname that picks none
      gets 404, except for /api/health.
    - Everything has UUIDs as ids. Quantities, unit families and units are
      global (every tenant sees them) or the tenant's own, and a tenant can
      turn quantities and families off.
    - Every account has a role (ACCOUNTS.md): a `viewer` reads everything
      but the accounts; a `user` also changes items and stock rows (with
      their values and attachments); an `admin` also sets up locations,
      classes, attributes and units, imports and exports model files, and
      manages accounts. History of items and stock rows is for every account,
      the rest for admins. A request the role doesn't allow gets 403.
    - Errors are RFC 9457 problem details (`application/problem+json`).
    - `GET /classes` and `GET /locations` support `ETag` / `If-None-Match`.
    - POST /login sets the session cookie `wtf_session` (HttpOnly,
      SameSite=Strict, Path=/api); send it back with every request. Only
      /api/health, /openapi.yaml and /login work without it. Requests that
      change something are refused (403) when their Origin header names
      another site.

servers:
  - url: /api/v1

security:
  - session: []

paths:
  /health:
    servers:
      - url: /api
    get:
      summary: Database reachability
      operationId: health
      security: []
      responses:
        "200":
          description: The database is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
        "503": { $ref: "#/components/responses/Problem" }

  /openapi.yaml:
    get:
      summary: This document
      operationId: openapi
      security: []
      responses:
        "200":
          description: The OpenAPI description.
          content:
            application/yaml: {}

  /quantities:
    get:
      summary: The quantities the tenant sees
      operationId: quantityList
      responses:
        "200":
          description: Quantities, alphabetically.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Quantity" } }
        default: { $ref: "#/components/responses/Problem" }

  /quantities/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: One quantity with the unit families the tenant sees, each with its units
      operationId: quantityGet
      responses:
        "200":
          description: The quantity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuantityDetail" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: Turn a quantity on or off for the tenant (admins)
      operationId: quantityPatch
      description: |
        Turning a quantity off turns its families off too. A quantity whose
        units live attributes or items use can't be turned off (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailabilityPatch" }
      responses:
        "200":
          description: The quantity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuantityDetail" }
        default: { $ref: "#/components/responses/Problem" }

  /units:
    get:
      summary: The units the tenant sees
      operationId: unitList
      parameters:
        - { name: quantity, in: query, schema: { $ref: "#/components/schemas/Uuid" }, description: Only units of this quantity. }
        - { name: family, in: query, schema: { $ref: "#/components/schemas/Uuid" }, description: Only units of this family. }
      responses:
        "200":
          description: Units, by family, smallest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Unit" } }
        default: { $ref: "#/components/responses/Problem" }

  /units/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: One unit
      operationId: unitGet
      responses:
        "200":
          description: The unit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        default: { $ref: "#/components/responses/Problem" }

  /model/import:
    post:
      summary: Import units, attributes and classes from a model file (admins)
      operationId: modelImport
      description: |
        The body is a model file (seed/model-format.md): quantities with their
        unit families and units, attributes, and a tree of classes with their
        attribute assignments. What the tenant has (or sees, for units) and
        is the same is used as it is; what isn't there is added, as the
        tenant's own; what differs is a conflict. An assignment that is the
        same as one the class inherits is there already. All or nothing: with
        a conflict, or with dry_run, nothing is kept. A body that isn't a
        valid model file is refused with 400. A file of only quantities is
        how units are imported.
      parameters:
        - { name: parent, in: query, schema: { $ref: "#/components/schemas/Uuid" }, description: The class to import below; the top of the class tree without it. }
        - { name: dry_run, in: query, schema: { type: boolean }, description: Only tell what would happen. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A model file, see seed/model-format.md. }
      responses:
        "200":
          description: What was (or would be) added, what was there already, and the conflicts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: boolean, description: Whether the import was kept. }
                  dry_run: { type: boolean }
                  quantities: { $ref: "#/components/schemas/ModelImportSection" }
                  families: { $ref: "#/components/schemas/ModelImportSection" }
                  units: { $ref: "#/components/schemas/ModelImportSection" }
                  attributes: { $ref: "#/components/schemas/ModelImportSection" }
                  options:
                    type: object
                    properties: { added: { type: array, items: { type: string }, description: '"Attribute: option"' } }
                  classes: { $ref: "#/components/schemas/ModelImportSection" }
                  assignments: { $ref: "#/components/schemas/ModelImportSection" }
                  conflicts:
                    type: array
                    items:
                      type: object
                      properties:
                        where: { type: string, description: 'e.g. "Class MCU/AVR: Clock", "Length › Imperial length › in"' }
                        message: { type: string }
        default: { $ref: "#/components/responses/Problem" }

  /unit-families:
    get:
      summary: The unit families the tenant sees, with their units
      operationId: unitFamilyList
      parameters:
        - { name: quantity, in: query, schema: { $ref: "#/components/schemas/Uuid" }, description: Only families of this quantity. }
      responses:
        "200":
          description: Unit families, by quantity.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UnitFamilyDetail" } }
        default: { $ref: "#/components/responses/Problem" }

  /unit-families/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: One unit family with its units, smallest first
      operationId: unitFamilyGet
      responses:
        "200":
          description: The unit family.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitFamilyDetail" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: Turn a unit family on or off for the tenant (admins)
      operationId: unitFamilyPatch
      description: |
        A family of a quantity that is turned off stays off. A family whose
        units live attributes or items use can't be turned off (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailabilityPatch" }
      responses:
        "200":
          description: The unit family.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitFamilyDetail" }
        default: { $ref: "#/components/responses/Problem" }

  /attributes:
    get:
      summary: All attributes
      operationId: attributeList
      responses:
        "200":
          description: Attributes, alphabetically.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Attribute" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: Create an attribute
      operationId: attributeCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, datatype]
              properties:
                name: { type: string }
                datatype: { $ref: "#/components/schemas/Datatype" }
                unit:
                  oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }]
                  description: With a unit, the datatype must be the unit's quantity's datatype; the unit must be available.
                unit_lock: { type: boolean, default: false, description: Always show values in the unit, instead of scaling them within its family. }
      responses:
        "201": { $ref: "#/components/responses/AttributeCreated" }
        default: { $ref: "#/components/responses/Problem" }

  /attributes/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: One attribute (with options for choice attributes)
      operationId: attributeGet
      responses:
        "200": { $ref: "#/components/responses/Attribute" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: Change an attribute
      operationId: attributePatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                datatype: { $ref: "#/components/schemas/Datatype" }
                unit: { $ref: "#/components/schemas/Uuid", description: Another available unit of the same quantity; a unit can't be added or removed. }
                unit_lock: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Attribute" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Mark an attribute deleted (it must not be in use)
      operationId: attributeDelete
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /attributes/{id}/options:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: The options of a choice attribute
      operationId: attributeOptionList
      responses:
        "200":
          description: Options, alphabetically.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Option" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: Add an option to a choice attribute
      operationId: attributeOptionCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created. `Location` points at /options/{id}.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Option" }
        default: { $ref: "#/components/responses/Problem" }

  /options/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: One option
      operationId: attributeOptionGet
      responses:
        "200": { $ref: "#/components/responses/Option" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: Rename an option
      operationId: attributeOptionPatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Option" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Mark an option deleted (it must not be in use)
      operationId: attributeOptionDelete
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /classes:
    get:
      summary: The whole class tree
      operationId: classList
      parameters: [{ $ref: "#/components/parameters/IfNoneMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Tree" }
        "304": { $ref: "#/components/responses/NotModified" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: Create a class
      operationId: classCreate
      requestBody: { $ref: "#/components/requestBodies/TreeNodeCreate" }
      responses:
        "201":
          description: Created. `Location` points at /classes/{id}.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassDetail" }
        default: { $ref: "#/components/responses/Problem" }

  /classes/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: One class with its effective attributes
      operationId: classGet
      responses:
        "200": { $ref: "#/components/responses/Class" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: Rename, move or (un)mark a class as a container
      operationId: classPatch
      requestBody: { $ref: "#/components/requestBodies/TreeNodePatch" }
      responses:
        "200": { $ref: "#/components/responses/Class" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Mark a class deleted; with recursive=true also every class below it
      description: |
        Without `recursive`, the class must have no subclasses or items (else 409).
        With `recursive=true`, the class and every class below it are deleted in one
        transaction. If any of them has items, nothing is deleted (409), unless `force=true`,
        which deletes the items too (with their values, stock rows and attachments).
        `GET /classes/{id}/deletion` previews it.
      operationId: classDelete
      parameters:
        - { $ref: "#/components/parameters/Recursive" }
        - { $ref: "#/components/parameters/Force" }
      responses:
        "200":
          description: "recursive=true: what was deleted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassDeletion" }
        "204": { description: Deleted (without recursive). }
        default: { $ref: "#/components/responses/Problem" }

  /classes/{id}/model:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: The class with everything below it, as a model file (admins)
      operationId: modelExport
      description: |
        A model file (seed/model-format.md) of the class and the live classes
        below it, with the class's inherited assignments as its own, every
        attribute they use, and the units of the tenant's own those attributes
        need, with their families. Units every WtF has are left out. "meta"
        names the class, the tenant and when. Importing the file where the
        class is changes nothing; importing it elsewhere sets up the same.
      responses:
        "200":
          description: A model file.
          content:
            application/json:
              schema: { type: object, description: A model file, see seed/model-format.md. }
        default: { $ref: "#/components/responses/Problem" }

  /classes/{id}/deletion:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      summary: What a recursive delete of the class would delete; deletes nothing
      description: |
        Needs the same role as the delete. Unlike the delete, it reports items
        without `force` instead of failing.
      operationId: classDeletion
      parameters:
        - { $ref: "#/components/parameters/Force" }
      responses:
        "200":
          description: What `DELETE /classes/{id}?recursive=true` would delete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassDeletion" }
        default: { $ref: "#/components/responses/Problem" }

  /classes/{id}/attributes/{attribute}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/Attribute" }
    put:
      summary: Assign an attribute to a class, or change its default
      operationId: classAttributeSet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                default:
                  description: Optional default in the attribute's datatype (numbers in the base unit); null for none.
                per_unit:
                  type: boolean
                  default: false
                  description: Values live on stock rows (each physical thing or batch) instead of on the item. Can't change while values exist.
                required:
                  type: boolean
                  default: false
                  description: New items (or stock rows, for per-unit attributes) need a value unless there is a default.
      responses:
        "200": { $ref: "#/components/responses/Class" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Remove an attribute from a class
      operationId: classAttributeRemove
      responses:
        "200": { $ref: "#/components/responses/Class" }
        default: { $ref: "#/components/responses/Problem" }

  /items:
    get:
      summary: Items, alphabetically, paged
      operationId: itemList
      parameters:
        - { name: class, in: query, schema: { $ref: "#/components/schemas/Uuid" }, description: Only items in this class or its subclasses. }
        - name: search
          in: query
          schema: { type: string }
          description: |
            Words separated by spaces. Every word must occur, as a case-insensitive
            substring, in the item name, a class in the item's class path, a text
            or url value, or a choice value (including class defaults the item
            shows). Different words may match in different places, so
            "resistor 0805" finds 0805 resistors.
        - name: where
          in: query
          schema: { type: string }
          description: |
            Attribute filters, all of which must match: a JSON list of
            {attribute, op, value}. Numbers and dates take =, >, >=, <, <= or
            between [low, high] (numbers in the base unit); text and url take
            = or contains; choices take = (one option) or in (a list), by id
            or name; booleans take = true or false. Compared with the values
            the item shows, class defaults included; a per-unit attribute
            matches when any live stock row does. See api/item.md.
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: "#/components/schemas/ItemListed" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: Create an item
      operationId: itemCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [class, name]
              properties:
                class: { $ref: "#/components/schemas/Uuid" }
                name: { type: string }
                unit:
                  oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }]
                  description: Unit stock is measured in, an available one; none means it is counted.
                unit_lock: { type: boolean, default: false, description: Always show stock in the unit, instead of scaling it within its family. }
                values:
                  type: object
                  description: Initial values, keyed by attribute id.
                  additionalProperties: true
      responses:
        "201":
          description: Created. `Location` points at /items/{id}.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        default: { $ref: "#/components/responses/Problem" }

  /items/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: One item with its values and stock rows
      operationId: itemGet
      responses:
        "200": { $ref: "#/components/responses/Item" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: Change an item
      operationId: itemPatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                class: { $ref: "#/components/schemas/Uuid" }
                name: { type: string }
                unit: { $ref: "#/components/schemas/Uuid", description: Another available unit of the same quantity; a unit can't be added or removed. }
                unit_lock: { type: boolean }
                photo: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }], description: "One of its own image attachments, or null for none." }
      responses:
        "200": { $ref: "#/components/responses/Item" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Mark an item deleted (it must have no stock)
      operationId: itemDelete
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /items/{id}/values/{attribute}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/Attribute" }
    put:
      summary: Set one value of an item
      operationId: valueSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value:
                  description: The value in the attribute's datatype; numbers in the base unit.
      responses:
        "200": { $ref: "#/components/responses/Item" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Remove one value of an item
      operationId: valueDelete
      responses:
        "200": { $ref: "#/components/responses/Item" }
        default: { $ref: "#/components/responses/Problem" }

  /locations:
    get:
      summary: The whole location tree
      operationId: locationList
      parameters: [{ $ref: "#/components/parameters/IfNoneMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Tree" }
        "304": { $ref: "#/components/responses/NotModified" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: Create a location
      operationId: locationCreate
      requestBody: { $ref: "#/components/requestBodies/TreeNodeCreate" }
      responses:
        "201":
          description: Created. `Location` points at /locations/{id}.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        default: { $ref: "#/components/responses/Problem" }

  /locations/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: One location
      operationId: locationGet
      responses:
        "200": { $ref: "#/components/responses/Location" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: Rename and/or move a location
      operationId: locationPatch
      requestBody: { $ref: "#/components/requestBodies/TreeNodePatch" }
      responses:
        "200": { $ref: "#/components/responses/Location" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Mark a location deleted; with recursive=true also every location below it
      description: |
        Without `recursive`, the location must have no sublocations or stock (else 409).
        With `recursive=true`, the location and every location below it are deleted in one
        transaction. If there is stock in any of them, nothing is deleted (409), unless
        `force=true`, which deletes those stock rows too. `GET /locations/{id}/deletion`
        previews it.
      operationId: locationDelete
      parameters:
        - { $ref: "#/components/parameters/Recursive" }
        - { $ref: "#/components/parameters/Force" }
      responses:
        "200":
          description: "recursive=true: what was deleted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationDeletion" }
        "204": { description: Deleted (without recursive). }
        default: { $ref: "#/components/responses/Problem" }

  /locations/{id}/deletion:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      summary: What a recursive delete of the location would delete; deletes nothing
      description: |
        Needs the same role as the delete. Unlike the delete, it reports stock
        without `force` instead of failing.
      operationId: locationDeletion
      parameters:
        - { $ref: "#/components/parameters/Force" }
      responses:
        "200":
          description: What `DELETE /locations/{id}?recursive=true` would delete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationDeletion" }
        default: { $ref: "#/components/responses/Problem" }

  /stock:
    get:
      summary: Stock rows, paged
      operationId: stockList
      parameters:
        - { name: item, in: query, schema: { $ref: "#/components/schemas/Uuid" }, description: Only this item. }
        - { name: location, in: query, schema: { $ref: "#/components/schemas/Uuid" }, description: Only this location and everything below it. }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of stock rows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      rows: { type: array, items: { $ref: "#/components/schemas/Stock" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: Register stock of an item at a location
      operationId: stockCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [item, location]
              properties:
                item: { $ref: "#/components/schemas/Uuid" }
                location: { $ref: "#/components/schemas/Uuid" }
                quantity:
                  type: [number, "null"]
                  description: In the base unit of the item's unit (counted if none); null = not counted.
                values:
                  type: object
                  description: Per-unit values, keyed by attribute id.
                  additionalProperties: true
      responses:
        "201":
          description: Created. `Location` points at /stock/{id}.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stock" }
        default: { $ref: "#/components/responses/Problem" }

  /stock/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: One stock row
      operationId: stockGet
      responses:
        "200": { $ref: "#/components/responses/Stock" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: Correct a stock row
      operationId: stockPatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                item: { $ref: "#/components/schemas/Uuid" }
                location: { $ref: "#/components/schemas/Uuid" }
                quantity: { type: [number, "null"] }
                photo: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }], description: "One of its own image attachments, or null for none." }
      responses:
        "200": { $ref: "#/components/responses/Stock" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Mark a stock row deleted
      operationId: stockDelete
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /stock/{id}/move:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Move (part of) a stock row to another location
      description: |
        Without quantity the whole row moves. If the destination already holds
        exactly one counted row of the same item, the amount is merged into it.
      operationId: stockMove
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [location]
              properties:
                location: { $ref: "#/components/schemas/Uuid" }
                quantity: { type: [number, "null"] }
      responses:
        "200": { $ref: "#/components/responses/Stock" }
        default: { $ref: "#/components/responses/Problem" }

