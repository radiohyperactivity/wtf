        default: { $ref: "#/components/responses/Problem" }

  /items/{id}/attachments/{attachment}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/AttachmentId" }
    get:
      summary: An attachment of an item
      operationId: itemAttachmentGet
      responses:
        "200": { $ref: "#/components/responses/Attachment" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: Change the title of an attachment of an item
      operationId: itemAttachmentPatch
      requestBody: { $ref: "#/components/requestBodies/AttachmentPatch" }
      responses:
        "200": { $ref: "#/components/responses/Attachment" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Mark an attachment of an item deleted
      description: If it was the photo, there is no photo any more, also after a restore. It is purged with "wtfd deleted purge"; then "wtfd gc" removes its file once no attachment has its hash.
      operationId: itemAttachmentDelete
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /items/{id}/attachments/{attachment}/restore:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/AttachmentId" }
    post:
      summary: Restore a deleted attachment of an item (the object must not be deleted)
      description: It comes back as an ordinary attachment, not as the photo it may have been.
      operationId: itemAttachmentRestore
      responses:
        "200": { $ref: "#/components/responses/Attachment" }
        default: { $ref: "#/components/responses/Problem" }

  /items/{id}/attachments/{attachment}/content:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/AttachmentId" }
    get:
      summary: The content of an attachment of an item
      description: |
        Images (except SVG), PDF and plain text are sent inline, everything
        else as a download, named after the title with an extension for the
        type. The ETag is the SHA-256 of the content, which never changes;
        Range requests are supported.
      operationId: itemAttachmentContent
      responses:
        "200":
          description: The file.
          headers:
            ETag: { schema: { type: string } }
            Content-Disposition: { schema: { type: string } }
          content:
            "*/*": {}
        "304": { description: Not modified. }
        default: { $ref: "#/components/responses/Problem" }

  /items/{id}/attachments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Attach a file to an item
      operationId: itemAttachmentCreate
      requestBody: { $ref: "#/components/requestBodies/Upload" }
      responses:
        "201": { $ref: "#/components/responses/AttachmentCreated" }
        default: { $ref: "#/components/responses/Problem" }

