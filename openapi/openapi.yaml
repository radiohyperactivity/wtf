  /classes/{id}/attachments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Attach a file to a class
      operationId: classAttachmentCreate
      requestBody: { $ref: "#/components/requestBodies/Upload" }
      responses:
        "201": { $ref: "#/components/responses/AttachmentCreated" }
        default: { $ref: "#/components/responses/Problem" }

  /login:
    post:
      summary: Log in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: |
            Logged in. The session is in the cookie `wtf_session`, never in the body;
            it expires after 30 days without use, and every answer renews it.
          headers:
            Set-Cookie:
              description: "wtf_session=<token>; Path=/api; Max-Age=2592000; HttpOnly; SameSite=Strict (and Secure over HTTPS)"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Problem" }
        "429":
          description: Too many failed logins; one attempt per minute until a login succeeds.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /logout:
    post:
      summary: End the current session
      operationId: logout
      responses:
        "204":
          description: Logged out; the session cookie is deleted.
          headers:
            Set-Cookie: { schema: { type: string } }
        default: { $ref: "#/components/responses/Problem" }

  /me:
    get:
      summary: The logged-in account
      operationId: me
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Problem" }

  /me/password:
    put:
      summary: Change the own password (ends all other sessions)
      operationId: passwordChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current, new]
              properties:
                current: { type: string }
                new: { type: string, minLength: 8, description: At most 72 bytes. }
      responses:
        "204": { description: Changed. }
        default: { $ref: "#/components/responses/Problem" }

  /accounts:
    get:
      summary: All accounts (admins)
      operationId: accountList
      responses:
        "200":
          description: Accounts, by email.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Account" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: Create an account (admins)
      operationId: accountCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string }
                password: { type: [string, "null"], description: Without a password the account can't log in. }
                role: { $ref: "#/components/schemas/Role", description: viewer when left out. }
      responses:
        "201":
          description: Created. `Location` points at /accounts/{id}.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Problem" }

  /accounts/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: One account (admins)
      operationId: accountGet
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: Change an account (admins)
      description: Changing the password ends the account's sessions. You can't change your own role.
      operationId: accountPatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: string }
                password: { type: [string, "null"], description: null removes the password (the account can't log in). }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Delete an account (admins; not your own)
      description: The account is marked deleted (history keeps referring to it); its email can be used again.
      operationId: accountDelete
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /items/{id}/history:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: History of an item
      description: The item, its values, its stock rows and their per-unit values, and the attachments of the item and its stock rows. Newest first; also for deleted objects. Every account may read it.
      operationId: itemHistory
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/History" }
        default: { $ref: "#/components/responses/Problem" }

  /stock/{id}/history:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: History of a stock row
      description: The row, its per-unit values and its attachments. Newest first; also for deleted objects. Every account may read it.
      operationId: stockHistory
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/History" }
        default: { $ref: "#/components/responses/Problem" }

  /locations/{id}/history:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: History of a location
      description: The location, stock rows that were there (including arrivals and departures), its attachments, and the locations directly inside it being added, moved in or out, deleted, restored or purged. Newest first; also for deleted objects. For admins.
      operationId: locationHistory
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/History" }
        default: { $ref: "#/components/responses/Problem" }

  /classes/{id}/history:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: History of a class
      description: The class, its attribute assignments, its attachments, and the classes directly below it and its items being added, moved in or out, deleted, restored or purged. Newest first; also for deleted objects. For admins.
      operationId: classHistory
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/History" }
        default: { $ref: "#/components/responses/Problem" }

  /attributes/{id}/history:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: History of an attribute
      description: The attribute and its options. Newest first; also for deleted objects. For admins.
      operationId: attributeHistory
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/History" }
        default: { $ref: "#/components/responses/Problem" }

  /accounts/{id}/history:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: History of an account
      description: Changes to the account itself. Newest first; also for deleted objects. For admins.
      operationId: accountHistory
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/History" }
        default: { $ref: "#/components/responses/Problem" }

  /locations/history:
    get:
      summary: History of the top-level locations
      description: Top-level locations being added, moved to or from the top level, deleted, restored or purged, so that a deleted one can be found. Newest first. For admins.
      operationId: locationListHistory
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/History" }
        default: { $ref: "#/components/responses/Problem" }

  /classes/history:
    get:
      summary: History of the top-level classes
      description: Top-level classes being added, moved to or from the top level, deleted, restored or purged, so that a deleted one can be found. Newest first. For admins.
      operationId: classListHistory
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/History" }
        default: { $ref: "#/components/responses/Problem" }

  /attributes/history:
    get:
      summary: History of the attributes
      description: Attributes being added, deleted, restored or purged, so that a deleted one can be found. Newest first. For admins.
      operationId: attributeListHistory
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/History" }
        default: { $ref: "#/components/responses/Problem" }

  /codes/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: A label code. Case and hyphens are ignored; I, L, O and U are invalid (clients map I/L to 1 and O to 0).
        schema: { type: string }
    get:
      summary: What a label code belongs to
      operationId: codeResolve
      responses:
        "200":
          description: The object the code belongs to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, enum: [location, item, stock] }
                  object:
                    oneOf:
                      - $ref: "#/components/schemas/Location"
                      - $ref: "#/components/schemas/ItemDetail"
                      - $ref: "#/components/schemas/Stock"
        default: { $ref: "#/components/responses/Problem" }

  # Restoring what was marked deleted (see api/deleting.md). Rules are checked
  # again as for something new; a 409 /problems/deleted explains what is in
  # the way, with a hint.
  /items/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Restore a deleted item, with the stock rows deleted together with it
      operationId: itemRestore
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, description: A new name. }
                class: { $ref: "#/components/schemas/Uuid", description: Restore it in this class instead. }
                with_parents: { type: boolean, description: Also restore its deleted class, and the deleted classes above it. }
      responses:
        "200": { $ref: "#/components/responses/Item" }
        default: { $ref: "#/components/responses/Problem" }

  /stock/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Restore a deleted stock row (not one merged into another)
      operationId: stockRestore
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                location: { $ref: "#/components/schemas/Uuid", description: Restore it at this location instead. }
                with_parents: { type: boolean, description: Also restore its deleted location, and the deleted locations above it. }
      responses:
        "200": { $ref: "#/components/responses/Stock" }
        default: { $ref: "#/components/responses/Problem" }

  /locations/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Restore a deleted location, with what was deleted together with it below it
      operationId: locationRestore
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreeNodeRestore" }
      responses:
        "200": { $ref: "#/components/responses/Location" }
        default: { $ref: "#/components/responses/Problem" }

  /classes/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Restore a deleted class, with the classes, items and stock rows deleted together with it
      operationId: classRestore
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreeNodeRestore" }
      responses:
        "200": { $ref: "#/components/responses/Class" }
        default: { $ref: "#/components/responses/Problem" }

  /attributes/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Restore a deleted attribute
      operationId: attributeRestore
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRestore" }
      responses:
        "200": { $ref: "#/components/responses/Attribute" }
        default: { $ref: "#/components/responses/Problem" }

  /options/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Restore a deleted option (its attribute must not be deleted)
      operationId: optionRestore
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRestore" }
      responses:
        "200": { $ref: "#/components/responses/Option" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: wtf_session
      description: The session cookie set by POST /login.

  headers:
    API-Revision:
      description: The revision of API version 1 the server implements; it grows with every addition.
      schema: { type: integer }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    AttachmentId:
      name: attachment
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    Attribute:
      name: attribute
      in: path
      required: true
      description: Attribute id.
      schema: { $ref: "#/components/schemas/Uuid" }
    Recursive:
      name: recursive
      in: query
      description: Delete everything below as well.
      schema: { type: boolean, default: false }
    Force:
      name: force
      in: query
      description: "With recursive: also delete what uses the deleted nodes (items of classes, stock at locations)."
      schema: { type: boolean, default: false }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: The ETag of the tree the client already has.
      schema: { type: string }

  requestBodies:
    Upload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: The file; its Content-Type is kept (and detected when missing or application/octet-stream).
              title: { type: string, description: "Default: the file's name." }
              photo: { type: boolean, description: "Make it the object's photo (images only)." }
    AttachmentPatch:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              title: { type: string }
    TreeNodeCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string }
              parent:
                oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }]
                description: Parent node; none for a root.
              container:
                type: boolean
                default: false
                description: Holds only other classes (no items) or locations (no stock).
              grid:
                type: object
                description: |
                  Locations only: also create a compartment below the new location for every
                  cell of a grid, named like spreadsheet cells (columns A, B, …, Z, AA, …; rows
                  1 …), e.g. 8 × 5 gives A1 … H5. The location becomes a container. Nothing
                  about the grid is stored.
                additionalProperties: false
                required: [columns, rows]
                properties:
                  columns: { type: integer, minimum: 1 }
                  rows: { type: integer, minimum: 1 }
                  confirm:
                    type: boolean
                    default: false
                    description: |
                      Required (true) when the grid creates more than 1000 locations (compartments
                      plus the location itself); otherwise the request fails with 400. Ask the
                      user first.
    TreeNodePatch:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name: { type: string }
              parent:
                oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }]
                description: New parent; null makes it a root.
              container:
                type: boolean
                description: Rejected (422) while the class has items or the location has stock.
              photo: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }], description: "One of its own image attachments, or null for none." }

  responses:
    History:
      description: One page of history entries, newest first.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Page"
              - type: object
                properties:
                  rows: { type: array, items: { $ref: "#/components/schemas/HistoryEntry" } }
    Attachment:
      description: The attachment.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Attachment" }
    AttachmentCreated:
      description: Created. `Location` points at the attachment, under its object.
      headers:
        Location: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Attachment" }
    Problem:
      description: An error (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotModified:
      description: The client's tree is current.
      headers:
        ETag: { schema: { type: string } }
    Tree:
      description: The tree with its version.
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Tree" }
    AttributeCreated:
      description: Created. `Location` points at /attributes/{id}.
      headers:
        Location: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Attribute" }
    Attribute:
      description: The attribute.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Attribute" }
    Option:
      description: The option.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Option" }
    Class:
      description: The class.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ClassDetail" }
    Location:
      description: The location.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Location" }
    Item:
      description: The item.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ItemDetail" }
    Stock:
      description: The stock row.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Stock" }

  schemas:
    Uuid:
      type: string
      format: uuid
    ClassDeletion:
      type: object
      properties:
        classes:
          type: array
          description: Deepest first.
          items:
            type: object
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              path: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              code: { type: string }
              name: { type: string }
              class: { $ref: "#/components/schemas/Uuid" }
        stock: { type: integer, description: Number of stock rows of those items. }
    LocationDeletion:
      type: object
      properties:
        locations:
          type: array
          description: Deepest first.
          items:
            type: object
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              code: { type: string }
              path: { type: string }
        stock:
          type: array
          description: The live stock rows; for a deleted item, those deleted together with it.
          items:
            type: object
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              code: { type: string }
              item:
                type: object
                properties:
                  id: { $ref: "#/components/schemas/Uuid" }
                  code: { type: string }
                  name: { type: string }
              location: { $ref: "#/components/schemas/Uuid" }
              quantity: { type: ["number", "null"] }

    Datatype:
      type: string
      enum: [text, integer, float, date, boolean, url, choice]

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, examples: [/problems/not-found] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        hint: { type: string, description: What to do about it, when the database knows (revision 2). }
        sqlstate: { type: string, description: PostgreSQL error code, when the error came from the database. }

    TreeNodeRestore:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, description: A new name, for when the old one has been taken since. }
        parent:
          oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }]
          description: Restore it under this parent instead; null at the top.
        with_parents: { type: boolean, description: Also restore the deleted nodes it is in. }

    NameRestore:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, description: A new name, for when the old one has been taken since. }

    Deleted:
      type: boolean
      description: Marked deleted (revision 2). Lists and trees leave deleted objects out; fetching one by id or code still works.

    NamedRef:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }

    PathEntry:
      $ref: "#/components/schemas/NamedRef"

    Page:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        rows: { type: array }

    Quantity:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        datatype: { type: string, enum: [integer, float] }
        base_unit:
          type: object
          description: The unit numbers are stored in, with factor 1 and offset 0.
          properties:
            symbol: { type: string }
            name: { type: string }
        global: { type: boolean, description: "Every tenant sees it; otherwise it is the tenant's own." }
        available: { type: boolean, description: "Lists and gets of quantities only: whether the tenant can choose its units." }
        standard: { type: boolean, description: "Lists and gets of quantities only: available when the tenant hasn't chosen (always true for its own)." }
        choice: { type: [boolean, "null"], description: "Lists and gets of quantities only: the tenant's choice; null follows the default." }

    QuantityDetail:
      allOf:
        - $ref: "#/components/schemas/Quantity"
        - type: object
          properties:
            families:
              type: array
              description: By name, without their quantity.
              items: { $ref: "#/components/schemas/UnitFamilyDetail" }

    AvailabilityPatch:
      type: object
      properties:
        available: { type: [boolean, "null"], description: "true or false; null follows the default again." }

    ModelImportSection:
      type: object
      properties:
        added: { type: array, items: { type: string }, description: 'Names; families as "Quantity › Family", units as "Quantity › Family › symbol"; classes as paths ("MCU/AVR"); assignments as "path: attribute".' }
        existing: { type: array, items: { type: string } }

    Unit:
      type: object
      description: base = value × base_factor + base_offset.
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        symbol: { type: string }
        global: { type: boolean, description: "Every tenant sees it; otherwise it is the tenant's own." }
        family:
          type: object
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            name: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
        base_factor: { type: number }
        base_offset: { type: number }

    UnitFamilyDetail:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
        global: { type: boolean, description: "Every tenant sees it; otherwise it is the tenant's own." }
        available: { type: boolean, description: Whether the tenant can choose its units; never while its quantity is off. }
        standard: { type: boolean, description: "Available when the tenant hasn't chosen (always true for its own)." }
        choice: { type: [boolean, "null"], description: "The tenant's choice; null follows the default." }
        units: { type: array, items: { $ref: "#/components/schemas/Unit" }, description: The ones the tenant sees, smallest first. }

    HistoryEntry:
      type: object
      properties:
        id: { type: integer }
        happened_at: { type: string, format: date-time, description: Start of the transaction. }
        transaction: { type: string, description: Entries of one API call share it. }
        account:
          description: Who made the change; null for changes outside the API.
          oneOf:
            - type: object
              properties:
                id: { $ref: "#/components/schemas/Uuid" }
                email: { type: string }
                deleted: { type: boolean }
            - type: "null"
        table: { type: string, description: e.g. item, value, stock, location. }
        operation: { type: string, enum: [insert, update, delete] }
        data: { type: object, description: The row after the change (before it, for a delete). }
        changes:
          type: [object, "null"]
          description: 'Updates only: {column: {old, new}}. A password change appears as {"password": "changed"}.'

    Role:
      type: string
      enum: [viewer, user, admin]
      description: Each role can do what the ones before it can (ACCOUNTS.md).

    Account:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        email: { type: string }
        has_password: { type: boolean }
        role: { $ref: "#/components/schemas/Role" }
        deleted: { type: boolean, description: Deleted accounts can't log in; they stay visible because history refers to them. }

    Attachment:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        title: { type: string }
        type: { type: string, description: MIME type. }
        size: { type: integer, description: In bytes. }
        hash: { type: string, description: Hex SHA-256 of the content. }
        deleted: { $ref: "#/components/schemas/Deleted" }

    Attachments:
      type: array
      description: The photo first, then by title.
      items: { $ref: "#/components/schemas/Attachment" }

    Values:
      type: array
      description: Own values plus class defaults (is_default) where there is no own value.
      items:
        type: object
        properties:
          attribute: { $ref: "#/components/schemas/Attribute" }
          value: { description: The value in the attribute's datatype; numbers in the base unit of the attribute's unit. }
          display: { $ref: "#/components/schemas/Display" }
          is_default: { type: boolean, description: The class default, shown because there is no own value. }

    Missing:
      type: array
      description: Required attributes without a value (and without a default).
      items: { $ref: "#/components/schemas/NamedRef" }

    Display:
      type: [object, "null"]
      description: A base-unit number in the best-scaling unit of the family, or in the unit itself with unit_lock.
      properties:
        value: { type: number }
        unit: { $ref: "#/components/schemas/Unit" }

    Attribute:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        datatype: { $ref: "#/components/schemas/Datatype" }
        unit:
          oneOf: [{ $ref: "#/components/schemas/Unit" }, { type: "null" }]
        unit_lock: { type: boolean }
        options:
          type: array
          description: Only for choice attributes in GET /attributes/{id}.
          items: { $ref: "#/components/schemas/NamedRef" }
        deleted: { $ref: "#/components/schemas/Deleted" }

    Option:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        attribute: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        deleted: { $ref: "#/components/schemas/Deleted" }

    TreeNode:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string, description: Label code; location trees only. }
        name: { type: string }
        parent: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        container: { type: boolean }
        photo:
          description: The class or location photo, or null.
          oneOf: [{ $ref: "#/components/schemas/Attachment" }, { type: "null" }]
        children: { type: array, items: { $ref: "#/components/schemas/TreeNode" } }

    Tree:
      type: object
      properties:
        version: { type: integer }
        unchanged: { type: boolean }
        tree: { type: array, items: { $ref: "#/components/schemas/TreeNode" } }

    ClassDetail:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        parent: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        container: { type: boolean, description: Holds only other classes, no items. }
        path: { type: array, items: { $ref: "#/components/schemas/PathEntry" } }
        deleted: { $ref: "#/components/schemas/Deleted" }
        attributes:
          type: array
          items:
            type: object
            properties:
              attribute: { $ref: "#/components/schemas/Attribute" }
              defined_on_class: { $ref: "#/components/schemas/Uuid" }
              inherited: { type: boolean }
              default: { description: The default in the attribute's datatype, or null. }
              default_display: { $ref: "#/components/schemas/Display" }
              per_unit: { type: boolean }
              required: { type: boolean }
        photo: { oneOf: [{ $ref: "#/components/schemas/Attachment" }, { type: "null" }] }
        attachments: { $ref: "#/components/schemas/Attachments" }

    Location:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string, description: Label code (Crockford Base32), e.g. 1A7K. }
        name: { type: string }
        parent: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        container: { type: boolean, description: Holds only other locations, no stock. }
        path: { type: array, items: { $ref: "#/components/schemas/PathEntry" } }
        deleted: { $ref: "#/components/schemas/Deleted" }
        photo:
          { oneOf: [{ $ref: "#/components/schemas/Attachment" }, { type: "null" }] }
          description: Only in GET /locations/{id}.
        attachments:
          $ref: "#/components/schemas/Attachments"
          description: Only in GET /locations/{id}.

    ItemSummary:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string, description: Label code (Crockford Base32), e.g. 1A7K. }
        name: { type: string }
        class: { $ref: "#/components/schemas/Uuid" }
        unit:
          oneOf: [{ $ref: "#/components/schemas/Unit" }, { type: "null" }]
        unit_lock: { type: boolean }
        deleted: { $ref: "#/components/schemas/Deleted" }
        photo:
          description: The item photo, or null.
          oneOf: [{ $ref: "#/components/schemas/Attachment" }, { type: "null" }]

    ItemListed:
      allOf:
        - $ref: "#/components/schemas/ItemSummary"
        - type: object
          properties:
            stock:
              type: object
              properties:
                total: { type: number }
                display: { $ref: "#/components/schemas/Display" }
                uncounted: { type: boolean }
            incomplete: { type: boolean, description: The item or one of its stock rows lacks a required value. }

    ItemDetail:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string, description: Label code (Crockford Base32), e.g. 1A7K. }
        name: { type: string }
        deleted: { $ref: "#/components/schemas/Deleted" }
        class: { $ref: "#/components/schemas/ClassDetail" }
        unit:
          oneOf: [{ $ref: "#/components/schemas/Unit" }, { type: "null" }]
        unit_lock: { type: boolean }
        values: { $ref: "#/components/schemas/Values" }
        missing: { $ref: "#/components/schemas/Missing" }
        photo: { oneOf: [{ $ref: "#/components/schemas/Attachment" }, { type: "null" }] }
        attachments: { $ref: "#/components/schemas/Attachments" }
        stock:
          type: array
          items:
            type: object
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              code: { type: string, description: Label code (Crockford Base32), e.g. 1A7K. }
              location: { $ref: "#/components/schemas/Uuid" }
              quantity: { type: [number, "null"] }
              display: { $ref: "#/components/schemas/Display" }
              values: { $ref: "#/components/schemas/Values" }
              missing: { $ref: "#/components/schemas/Missing" }
              photo: { oneOf: [{ $ref: "#/components/schemas/Attachment" }, { type: "null" }] }
              attachments: { $ref: "#/components/schemas/Attachments" }

    Stock:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string, description: Label code (Crockford Base32), e.g. 1A7K. }
        item: { $ref: "#/components/schemas/ItemSummary" }
        location: { $ref: "#/components/schemas/Uuid" }
        quantity: { type: [number, "null"] }
        display: { $ref: "#/components/schemas/Display" }
        deleted: { $ref: "#/components/schemas/Deleted" }
        merged_into:
          description: For a row a move merged into another, that row.
          oneOf:
            - type: object
              properties:
                id: { $ref: "#/components/schemas/Uuid" }
                code: { type: string }
            - type: "null"
        values:
          $ref: "#/components/schemas/Values"
          description: Not in GET /stock list rows.
        missing:
          $ref: "#/components/schemas/Missing"
          description: Not in GET /stock list rows.
        photo:
          description: The stock row photo, or null.
          oneOf: [{ $ref: "#/components/schemas/Attachment" }, { type: "null" }]
        attachments:
          $ref: "#/components/schemas/Attachments"
          description: Not in GET /stock list rows.
